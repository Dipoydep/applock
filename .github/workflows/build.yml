name: Build AppLock APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Setup Python untuk generate icon
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate semua ukuran launcher icon dari icon.png
        run: |
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw
          import os

          sizes = {
              "mdpi":    48,
              "hdpi":    72,
              "xhdpi":   96,
              "xxhdpi":  144,
              "xxxhdpi": 192,
          }

          if not os.path.exists("icon.png"):
              print("icon.png tidak ada, buat default...")
              size = 1024
              img = Image.new("RGBA", (size, size), (108, 99, 255, 255))
              draw = ImageDraw.Draw(img)
              draw.rounded_rectangle([280, 480, 744, 800], radius=60, fill="white")
              draw.arc([340, 220, 684, 560], start=200, end=340, fill="white", width=80)
              draw.ellipse([462, 570, 562, 670], fill=(108, 99, 255, 255))
              draw.rectangle([492, 630, 532, 720], fill=(108, 99, 255, 255))
              img.save("icon.png")
              print("Default icon dibuat!")

          src = Image.open("icon.png").convert("RGBA")

          for density, px in sizes.items():
              out_dir = f"app/src/main/res/mipmap-{density}"
              os.makedirs(out_dir, exist_ok=True)

              resized = src.resize((px, px), Image.LANCZOS)

              # Rounded corners
              mask = Image.new("L", (px, px), 0)
              ImageDraw.Draw(mask).rounded_rectangle([0, 0, px-1, px-1], radius=px//5, fill=255)
              out = Image.new("RGBA", (px, px), (0,0,0,0))
              out.paste(resized, mask=mask)
              out.save(f"{out_dir}/ic_launcher.png")

              # Circle
              mask2 = Image.new("L", (px, px), 0)
              ImageDraw.Draw(mask2).ellipse([0, 0, px-1, px-1], fill=255)
              out2 = Image.new("RGBA", (px, px), (0,0,0,0))
              out2.paste(resized, mask=mask2)
              out2.save(f"{out_dir}/ic_launcher_round.png")

              print(f"Generated {density} ({px}x{px})")

          print("Semua icon berhasil!")
          PYEOF

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppLock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          
