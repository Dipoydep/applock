name: Build AppLock APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install ImageMagick untuk generate ikon
        run: sudo apt-get install -y imagemagick

      - name: Generate semua ukuran launcher icon dari icon.png
        run: |
          # Cek ada icon.png di root atau tidak
          if [ ! -f "icon.png" ]; then
            echo "icon.png tidak ditemukan, buat ikon default pakai ImageMagick..."
            convert -size 1024x1024 xc:#6C63FF \
              -fill white -draw "roundrectangle 212,212 812,812 80,80" \
              -fill '#6C63FF' \
              -draw "rectangle 380,280 644,480" \
              -fill white \
              -draw "roundrectangle 350,430 674,780 40,40" \
              -draw "circle 512,610 512,660" \
              icon.png
          fi

          # Ukuran tiap density
          declare -A SIZES=(
            [mdpi]=48
            [hdpi]=72
            [xhdpi]=96
            [xxhdpi]=144
            [xxxhdpi]=192
          )

          for DENSITY in "${!SIZES[@]}"; do
            SIZE=${SIZES[$DENSITY]}
            DIR="app/src/main/res/mipmap-${DENSITY}"
            mkdir -p "$DIR"

            # Bikin rounded corner versi (foreground)
            convert icon.png -resize ${SIZE}x${SIZE} \
              \( +clone -alpha extract \
                -draw "roundrectangle 0,0 ${SIZE},${SIZE} $((SIZE/5)),$((SIZE/5))" \
                -alpha off \
              \) -compose copy-opacity -composite \
              "${DIR}/ic_launcher.png"

            # Round icon (circle)
            convert icon.png -resize ${SIZE}x${SIZE} \
              \( +clone -alpha extract \
                -draw "circle $((SIZE/2)),$((SIZE/2)) $((SIZE/2)),0" \
                -alpha off \
              \) -compose copy-opacity -composite \
              "${DIR}/ic_launcher_round.png"

            echo "Generated ${DENSITY} (${SIZE}x${SIZE})"
          done

          # Hapus adaptive icon XML lama (pakai PNG sekarang)
          for DENSITY in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            rm -f "app/src/main/res/mipmap-${DENSITY}/ic_launcher.xml"
            rm -f "app/src/main/res/mipmap-${DENSITY}/ic_launcher_round.xml"
          done

          echo "Semua ikon berhasil digenerate!"

      - name: Update AndroidManifest supaya pakai PNG icon
        run: |
          # Pastikan manifest pakai @mipmap/ic_launcher (kompatibel PNG dan XML)
          echo "Manifest sudah kompatibel dengan PNG icons"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Izin execute gradlew
        run: chmod +x gradlew

      - name: Download Gradle wrapper jar
        run: |
          mkdir -p gradle/wrapper
          curl -Lo gradle/wrapper/gradle-wrapper.jar \
            https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppLock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          
