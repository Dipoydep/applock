name: Build AppLock APK

on:
push:
branches: [ main ]
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-24.04

steps:
  - name: Checkout kode
    uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      java-version: '17'
      distribution: temurin

  - name: Install ImageMagick
    run: |
      sudo apt-get update
      sudo apt-get install -y imagemagick
      convert -version

  - name: Generate launcher icons
    shell: bash
    run: |
      set -euo pipefail

      if [ ! -f icon.png ]; then
        echo "icon.png tidak ditemukan, membuat ikon default..."
        convert -size 1024x1024 xc:'#6C63FF' \
          -fill white \
          -draw "roundrectangle 212,212 812,812 80,80" \
          -fill '#6C63FF' \
          -draw "rectangle 380,280 644,480" \
          -fill white \
          -draw "roundrectangle 350,430 674,780 40,40" \
          -draw "circle 512,610 512,660" \
          icon.png
      fi

      declare -A SIZES=(
        [mdpi]=48
        [hdpi]=72
        [xhdpi]=96
        [xxhdpi]=144
        [xxxhdpi]=192
      )

      for DENSITY in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
        SIZE="${SIZES[$DENSITY]}"
        DIR="app/src/main/res/mipmap-${DENSITY}"
        mkdir -p "$DIR"

        convert icon.png -resize "${SIZE}x${SIZE}" \
          \( +clone -alpha extract \
            -draw "fill black rectangle 0,0 ${SIZE},${SIZE}" \
            -draw "fill white roundrectangle 0,0 ${SIZE},${SIZE} $((SIZE/5)),$((SIZE/5))" \
          \) -compose CopyOpacity -composite \
          "${DIR}/ic_launcher.png"

        convert icon.png -resize "${SIZE}x${SIZE}" \
          \( +clone -alpha extract \
            -draw "fill black rectangle 0,0 ${SIZE},${SIZE}" \
            -draw "fill white circle $((SIZE/2)),$((SIZE/2)) $((SIZE/2)),0" \
          \) -compose CopyOpacity -composite \
          "${DIR}/ic_launcher_round.png"

        echo "Generated ${DENSITY}: ${SIZE}x${SIZE}"
      done

      echo "Launcher icons selesai dibuat."

  - name: Periksa file proyek
    run: |
      test -f settings.gradle
      test -f build.gradle
      test -f app/build.gradle
      test -f app/src/main/AndroidManifest.xml

  - name: Setup Gradle 8.2
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.2'

  - name: Build Debug APK
    run: gradle assembleDebug --no-daemon --stacktrace

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: AppLock-debug-apk
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 30
