name: Build AppLock APK

on:
push:
branches: [ main ]
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-24.04

steps:
  - name: Checkout kode
    uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      java-version: '17'
      distribution: 'temurin'

  - name: Update APT dan Install ImageMagick
    run: |
      sudo apt-get clean
      sudo apt-get update
      sudo apt-get install -y imagemagick
      convert -version

  - name: Generate semua ukuran launcher icon dari icon.png
    shell: bash
    run: |
      set -e

      # Buat ikon default jika icon.png tidak tersedia
      if [ ! -f "icon.png" ]; then
        echo "icon.png tidak ditemukan, membuat ikon default..."

        convert -size 1024x1024 xc:'#6C63FF' \
          -fill white \
          -draw "roundrectangle 212,212 812,812 80,80" \
          -fill '#6C63FF' \
          -draw "rectangle 380,280 644,480" \
          -fill white \
          -draw "roundrectangle 350,430 674,780 40,40" \
          -draw "circle 512,610 512,660" \
          icon.png
      fi

      # Ukuran launcher icon untuk tiap density
      declare -A SIZES=(
        [mdpi]=48
        [hdpi]=72
        [xhdpi]=96
        [xxhdpi]=144
        [xxxhdpi]=192
      )

      for DENSITY in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
        SIZE=${SIZES[$DENSITY]}
        DIR="app/src/main/res/mipmap-${DENSITY}"

        mkdir -p "$DIR"

        # Launcher icon dengan sudut membulat
        convert icon.png \
          -resize "${SIZE}x${SIZE}" \
          \( +clone -alpha extract \
            -draw "fill black rectangle 0,0 ${SIZE},${SIZE}" \
            -draw "fill white roundrectangle 0,0 ${SIZE},${SIZE} $((SIZE/5)),$((SIZE/5))" \
          \) \
          -compose CopyOpacity -composite \
          "${DIR}/ic_launcher.png"

        # Launcher icon berbentuk lingkaran
        convert icon.png \
          -resize "${SIZE}x${SIZE}" \
          \( +clone -alpha extract \
            -draw "fill black rectangle 0,0 ${SIZE},${SIZE}" \
            -draw "fill white circle $((SIZE/2)),$((SIZE/2)) $((SIZE/2)),0" \
          \) \
          -compose CopyOpacity -composite \
          "${DIR}/ic_launcher_round.png"

        echo "Generated ${DENSITY}: ${SIZE}x${SIZE}"
      done

      # Hapus adaptive icon XML lama dari folder mipmap density
      for DENSITY in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
        rm -f "app/src/main/res/mipmap-${DENSITY}/ic_launcher.xml"
        rm -f "app/src/main/res/mipmap-${DENSITY}/ic_launcher_round.xml"
      done

      echo "Semua launcher icon berhasil digenerate!"

  - name: Periksa AndroidManifest
    run: |
      echo "Memeriksa konfigurasi launcher icon..."

      if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
        echo "ERROR: AndroidManifest.xml tidak ditemukan!"
        exit 1
      fi

      grep -nE 'android:icon|android:roundIcon' \
        app/src/main/AndroidManifest.xml || true

      echo "Pastikan manifest menggunakan @mipmap/ic_launcher."

  - name: Cache Gradle
    uses: actions/cache@v4
    with:
      path: |
        ~/.gradle/caches
        ~/.gradle/wrapper
      key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      restore-keys: |
        ${{ runner.os }}-gradle-

  - name: Izin execute gradlew
    run: chmod +x gradlew

  - name: Download Gradle wrapper jar jika belum tersedia
    run: |
      mkdir -p gradle/wrapper

      if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
        curl -fL --retry 3 --retry-delay 2 \
          -o gradle/wrapper/gradle-wrapper.jar \
          https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar
      fi

      test -s gradle/wrapper/gradle-wrapper.jar

  - name: Build Debug APK
    run: ./gradlew assembleDebug --no-daemon --stacktrace

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: AppLock-debug-apk
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 30
